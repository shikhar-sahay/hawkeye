<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hawkeyelogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hawkeye — Web Application Security Monitoring</title>
    <meta
      name="description"
      content="Hawkeye is a self-hosted security monitoring platform for web applications: ingest security events, detect attacks with seven detection engines, map findings to MITRE ATT&CK, and correlate alerts into incidents in real time."
    />
    <meta name="theme-color" content="#060a13" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/hawkeyelogo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hawkeye" />
    <meta property="og:title" content="Hawkeye — Web Application Security Monitoring" />
    <meta
      property="og:description"
      content="Self-hosted security monitoring for web applications. Ingest events, detect attacks, correlate incidents — your telemetry stays in your infrastructure."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hawkeye — Web Application Security Monitoring" />
    <meta
      name="twitter:description"
      content="Self-hosted security monitoring for web applications. Ingest events, detect attacks, correlate incidents."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <!-- Prevent flash of wrong theme: applies the stored theme class before
         first paint. Mirrors ThemeProvider (themes: light | dark | black). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "black") t = "dark";
          var el = document.documentElement;
          el.classList.add(t);
          el.style.colorScheme = t === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
