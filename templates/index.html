<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HawkEye SIEM Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <header>
        <h1>HawkEye SIEM</h1>
        <p>Real-time Security Event Monitoring & Attack Path Visualization</p>
    </header>

    <main>
        <section>
            <h2>Predicted Risk</h2>
            <div id="risk-display">0</div>
        </section>

        <section>
            <h2>Live Logs</h2>
            <table>
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Source</th>
                        <th>Event</th>
                        <th>Severity</th>
                    </tr>
                </thead>
                <tbody id="log-body"></tbody>
            </table>
        </section>

        <section>
            <h2>Attack Timeline</h2>
            <ul id="timeline"></ul>
        </section>

        <section>
            <h2>Attack Graph</h2>
            <div id="attack-path-graph" style="width:100%;height:500px;"></div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
