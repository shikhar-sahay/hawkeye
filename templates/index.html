<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HawkEye</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='hawkeyelogo.png') }}">
</head>
<body>
    <header>
        <div class="header-content">
            <h1 class="title">HawkEye SIEM</h1>
            <p class="subtitle">Your Eyes on Every Threat, Every Second.</p>
        </div>
    </header>

    <main>
        <section id="logs-section">
            <h2>Live Logs</h2>
            <table id="log-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Source</th>
                        <th>Event</th>
                        <th>IP</th>
                        <th>Severity</th>
                        <th>Geolocation</th>
                        <th>Threat Score</th>
                    </tr>
                </thead>
                <tbody id="log-body"></tbody>
            </table>
        </section>

        <section id="attack-path-section">
            <h2>Attack Path</h2>
            <div id="attack-path-graph" style="width:100%;height:500px;"></div>
        </section>

        <section id="timeline-section">
            <h2>Live Attack Timeline</h2>
            <ul id="timeline"></ul>
        </section>

        <section id="risk-section">
            <h2>Predicted Risk</h2>
            <div id="risk-display">Risk: 0/100 | Attack Progress: 0%</div>
        </section>

        <section id="upload-section">
            <h2>Upload Logs</h2>
            <div class="upload-container">
                <label class="custom-file-upload">
                    <img src="{{ url_for('static', filename='hawkeyelogo.png') }}" alt="Logo" class="upload-icon">
                    Choose File
                    <input type="file" id="log-file" onchange="updateFileName()">
                </label>
                <span id="file-name">No file chosen</span>
                <button onclick="uploadLogs()">Upload</button>
            </div>
            <p id="upload-status"></p>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        function updateFileName() {
            const input = document.getElementById('log-file');
            const fileName = input.files.length ? input.files[0].name : "No file chosen";
            document.getElementById('file-name').innerText = fileName;
        }
    </script>
</body>
</html>
